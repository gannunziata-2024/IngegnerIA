<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IngegnerIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Design system: blu notte / azzurro / bianco */
    :root {
      --night: #0b1f3a;     /* blu notte, fondo */
      --night-2: #13305a;   /* blu notte chiaro, alone centrale */
      --sky: #7dd3fc;       /* azzurro, accenti principali */
      --sky-deep: #38bdf8;  /* azzurro intenso, dettagli */
      --white: #ffffff;     /* bianco, testo principale */
      --muted: #9fb3cc;     /* testo secondario */
      --track: rgba(159, 179, 204, 0.18);
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--night);
      font-family: var(--sans);
      color: var(--white);
      overflow: hidden;
    }

    /* ---------- Schermata di avvio ---------- */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(circle at 50% 35%, var(--night-2) 0%, var(--night) 70%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Reticolo di fondo a quadretti, richiama il disegno tecnico */
    .splash::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(125, 211, 252, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 211, 252, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 560px;
    }

    /* ---------- Logo (simbolo) ---------- */
    .logo {
      width: 128px;
      height: 128px;
      margin-bottom: 28px;
      opacity: 0;
      transform: scale(0.6) rotate(-30deg);
      animation: logoIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    }

    .gear {
      transform-origin: 50% 50%;
      animation: spin 14s linear infinite;
    }

    .spark {
      transform-origin: 50% 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }

    /* ---------- Titolo ---------- */
    .title {
      font-size: clamp(2.6rem, 7.5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
    }

    .title .word,
    .title .i-mark,
    .title .a {
      display: inline-block;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }

    .title .word { animation-delay: 0.6s; }
    .title .i-mark { animation-delay: 0.85s; }
    .title .a { animation-delay: 1.0s; }

    .word { color: var(--white); }
    .a { color: var(--white); }

    /* Lettera I in stile CNI: asta spessa con grazie sottili, rossa come nel logo CNI */
    .i-mark {
      width: 0.34em;
      height: 0.74em;
      vertical-align: baseline;
      margin: 0 0.01em 0 0.02em;
      fill: #cd061e;
    }

    .tagline {
      margin-top: 18px;
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--sky);
      opacity: 0;
      animation: fadeUp 0.6s ease 1.5s forwards;
    }

    .description {
      margin-top: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 44ch;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.8s forwards;
    }

    /* ---------- Barra di caricamento ---------- */
    .loader {
      margin-top: 44px;
      width: min(260px, 70vw);
      opacity: 0;
      animation: fadeUp 0.5s ease 2.0s forwards;
    }

    .bar {
      height: 4px;
      width: 100%;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--sky-deep), var(--white));
      border-radius: inherit;
      animation: load 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) 2.0s forwards;
    }

    .status {
      margin-top: 12px;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      min-height: 1em;
    }

    .footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      opacity: 0;
      animation: fadeIn 0.8s ease 2.2s forwards;
    }

    /* ---------- Animazioni ---------- */
    @keyframes logoIn {
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 0.8; }
    }

    @keyframes load {
      to { width: 100%; }
    }

    /* Rispetto delle preferenze di accessibilità */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .gear, .spark { animation: none !important; }
    }
  </style>
</head>
<body>

  <div class="splash" id="splash" role="status" aria-live="polite" aria-label="Caricamento di IngegnerIA">
    <div class="content">

      <!-- Logo: ingranaggio (ingegneria) con scintilla (IA) -->
      <svg class="logo" viewBox="0 0 128 128" aria-hidden="true">
        <g class="gear">
          <path
            fill="none"
            stroke="#7dd3fc"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M64 8 L74 8 L77 20 L86 24 L96 17 L104 25 L97 35 L101 44 L113 47 L113 58
               L113 70 L101 73 L97 82 L104 92 L96 100 L86 93 L77 97 L74 109 L64 109
               L54 109 L51 97 L42 93 L32 100 L24 92 L31 82 L27 73 L15 70 L15 58
               L15 47 L27 44 L31 35 L24 25 L32 17 L42 24 L51 20 L54 8 Z"
          />
          <circle cx="64" cy="58" r="22" fill="none" stroke="#38bdf8" stroke-width="6" />
        </g>
        <!-- Scintilla dell'IA -->
        <path
          class="spark"
          fill="#cd061e"
          d="M64 40 L68.5 54.5 L83 59 L68.5 63.5 L64 78 L59.5 63.5 L45 59 L59.5 54.5 Z"
        />
      </svg>

      <h1 class="title" aria-label="IngegnerIA">
        <span class="word">Ingegner</span><svg class="i-mark" viewBox="0 0 40 100" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="40" height="3.2"/><rect x="12.6" y="0" width="14.8" height="100"/><rect x="0" y="96.8" width="40" height="3.2"/></svg><span class="a">A</span>
      </h1>

      <p class="tagline">
        Dalla guida agli strumenti
      </p>

      <p class="description">
        App di supporto agli ingegneri per un utilizzo consapevole dell'intelligenza artificiale
      </p>

      <div class="loader">
        <div class="bar">
          <div class="bar-fill"></div>
        </div>
        <div class="status" id="status">Preparazione in corso</div>
      </div>

    </div>

    <div class="footer">Versione 1.0</div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var status = document.getElementById('status');

      var steps = [
        { at: 2000, text: 'Preparazione in corso' },
        { at: 3000, text: 'Caricamento degli strumenti' },
        { at: 3900, text: 'Verifica delle impostazioni' },
        { at: 4600, text: 'Benvenuto' }
      ];

      steps.forEach(function (s) {
        setTimeout(function () { status.textContent = s.text; }, s.at);
      });

      function close() {
        splash.classList.add('hidden');
        splash.setAttribute('aria-hidden', 'true');
        document.dispatchEvent(new CustomEvent('splash:done'));
      }

      // Chiusura automatica a fine caricamento
      var timer = setTimeout(close, 5000);

      // Un tocco o un clic saltano la schermata
      splash.addEventListener('click', function () {
        clearTimeout(timer);
        close();
      });
    })();
  </script>

</body>
</html>
